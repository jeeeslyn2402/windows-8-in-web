<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.3, maximum-scale=0.5">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preload" href="../assets/Inter-VariableFont_opsz,wght.woff2" as="font" type="font/woff2" crossorigin="anonymous" />

    <link rel="stylesheet" href="./start_styles.css">
    <script defer src="./start.js"></script>
    <title>Start</title>
    <script>
        window.onload = () => {
    const h1s = document.querySelectorAll('.header h1');
    h1s.forEach(h1 => {
        setTimeout(() => {
            requestAnimationFrame(() => {
                h1.classList.add('visible');
                h1.style.animation = 'fadeInLeft .6s cubic-bezier(0.075, 0.82, 0.165, 1)';
                h1.addEventListener('animationend', () => {
                    h1.style.animation = ''
                })
            }, {once: true})
        }, 800)
    })
}
    </script>

</head>
<body>
    <div class="card-overlay">
        <div class="overlay-header">
            <div></div>
            <h1 id="devName"></h1>
            <div class="actions">
                <button class="btn">-</button>
                <button class="btn close-btn">&times;</button>
            </div>
        </div>
    </div>
    <div class="charms">
        
        <div class="charms-system-panel">
            <div class="charms-system-tray">
                <i class="uil uil-battery-empty"></i>
            </div>
            <div class="charms-date-container">
                <div class="charms-clock">
                    <h1 id="clock"></h1>
                </div>
                <div class="charms-date">
                    <h1 class="charms-day" id="chday"></h1>
                    <h1 class="charms-month" id="chdate"></h1>
                </div>
            </div>
            <script>
                
            </script>
        </div>
    </div>
    <section class="about-me">
        <div class="page apps active">
            <div class="header">
                <h1>Apps</h1>
                <div></div>
            </div>
            
        </div>
    </section>
</body>
</html>
