<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" as="style" href="./logonui.css" onload="this.rel='stylesheet'" />
    <link rel="stylesheet" href="./start_styles.css" />
    <script src="./logon.js" defer></script>
    <title>LogonUI</title>
</head>
<body>
    <div class="lock-screen">
        <!-- Lock screen will be implemented in Alpha 0.5! -->
    </div>
    <div class="logon">
        <div class="user-container">
            <div class="user-pic-container">
                <img class="user-pic" src="../assets/icon/windows8_account_picture.png" alt="user picture">
            </div>
            <div class="user-column">
                <div class="user-name">
                    <h1>User</h1>
                </div>
                <div class="welcome-block">
                    <img class="windows-loader" src="../assets/icon/windows-8-loader-normal.gif" alt="windows loader" />
                    <h2>Welcome</h2>
                </div>
            </div>
        </div>
        <div class="footer">

        </div>
    </div>
</body>
</html>
